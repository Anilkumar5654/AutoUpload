name: Auto Upload Lofi Video

on:
  # Runs automatically every Monday at 09:00 UTC
  schedule:
    - cron: '0 9 * * 1'
  # Allows manual triggering from the Actions tab
  workflow_dispatch:
    inputs:
      privacy_status:
        description: "YouTube privacy status for this upload"
        required: false
        default: "unlisted"
        type: choice
        options:
          - unlisted
          - public
          - private

permissions:
  contents: write

# Prevents a manual run and a scheduled run from overlapping — without this,
# two runs can both read the same upload_history.json before either writes
# back, and end up uploading the same song twice (and racing on git push).
concurrency:
  group: youtube-auto-upload
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    # MusicGen on a free CPU runner is slow — give it real headroom.
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Install PyTorch (CPU-only build)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Cache MusicGen model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-musicgen-${{ runner.os }}

      - name: Verify required secrets are set
        run: |
          if [ -z "${{ secrets.YOUTUBE_CLIENT_ID }}" ] || \
             [ -z "${{ secrets.YOUTUBE_CLIENT_SECRET }}" ] || \
             [ -z "${{ secrets.YOUTUBE_REFRESH_TOKEN }}" ]; then
            echo "::error::One or more required secrets (YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET, YOUTUBE_REFRESH_TOKEN) are missing. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Run video generator and upload
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PRIVACY_STATUS: ${{ github.event.inputs.privacy_status || 'unlisted' }}
          DEFAULT_PLAYLIST_ID: ${{ secrets.DEFAULT_PLAYLIST_ID }}
          MUSICGEN_DURATION_SECONDS: ${{ vars.MUSICGEN_DURATION_SECONDS || '60' }}
        run: |
          python generator.py

      - name: Commit updated upload history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/upload_history.json 2>/dev/null)" ]; then
            git add data/upload_history.json
            git commit -m "chore: update upload history [skip ci]"
            git push
          else
            echo "No history changes to commit."
          fi

      - name: Upload generated video as workflow artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: |
            output/*.mp4
            output/*.jpg
          retention-days: 7
          if-no-files-found: ignore
